# WTH Phase 1 concept-anchor definitions
#
# These anchors support comparative concept mapping across Science,
# Advaita Vedanta, and Samkhya without treating their claims as equivalent.
#
# Required approval step:
# 1. Review each definition and domain terminology.
# 2. Replace reviewed_by: pending_human_review.
# 3. Update reviewed_at.
# 4. Change anchor_version from phase1-anchor-v1-draft
#    to phase1-anchor-v1.
# 5. Generate the 768-dimensional anchor embeddings.

- concept_id: "10000000-0000-4000-8000-000000000002"
  concept_slug: "consciousness"

  canonical_definition: >-
    Consciousness concerns the presence, structure, or nature of subjective
    experience and awareness. It includes questions about what it is like to
    experience, the conditions under which experience occurs, and the relation
    between awareness and mental, bodily, or metaphysical processes. The term
    must be interpreted within each domain's own framework rather than as a
    single theory shared by Science, Advaita Vedanta, and Samkhya.

  positive_indicators:
    - "subjective experience or phenomenal experience"
    - "awareness, witnessing, or the presence of experience"
    - "the distinction between conscious and unconscious processing"
    - "the conditions, correlates, contents, or structure of conscious experience"
    - "first-person experience and what-it-is-like character"
    - "self-luminous awareness or consciousness as witness"
    - "Purusha as the sentient or witnessing principle"
    - "the relation between awareness and mind, body, buddhi, or cognition"
    - "neural, cognitive, or philosophical theories of consciousness"
    - "alterations, illusions, or boundaries of conscious experience"

  domain_terminology:
    science:
      - "phenomenal consciousness"
      - "subjective experience"
      - "conscious awareness"
      - "access consciousness"
      - "neural correlates of consciousness"
      - "contents of consciousness"
      - "level of consciousness"
      - "reportable experience"
      - "metacognitive awareness"
      - "bodily self-consciousness"
      - "conscious perception"
      - "unconscious processing"

    advaita:
      - "cit"
      - "chaitanya"
      - "pure consciousness"
      - "self-luminous awareness"
      - "sakshin"
      - "witness consciousness"
      - "drik"
      - "Atman as awareness"
      - "Brahman as consciousness"
      - "awareness distinct from mental modifications"
      - "consciousness underlying waking, dream, and deep sleep"

    samkhya:
      - "Purusha"
      - "drashta"
      - "seer"
      - "witness"
      - "sentient principle"
      - "conscious principle"
      - "caitanya"
      - "non-agent awareness"
      - "buddhi reflecting consciousness"
      - "distinction between Purusha and Prakriti"
      - "experience arising through proximity of Purusha and Prakriti"

  related_non_equivalent_terms:
    - "attention"
    - "wakefulness"
    - "intelligence"
    - "cognition"
    - "memory"
    - "perception"
    - "mind"
    - "self"
    - "sentience"
    - "reportability"
    - "knowledge"
    - "soul"
    - "Brahman"
    - "Purusha"
    - "buddhi"

  explicit_exclusions:
    - "attention discussed without any connection to conscious experience"
    - "wakefulness or arousal treated only as a physiological state"
    - "intelligence, reasoning, or problem solving without subjective awareness"
    - "unconscious information processing with no relevance to consciousness"
    - "the word awareness used merely to mean possession of information"
    - "mind discussed only as cognition, memory, or emotion"
    - "religious references to soul that do not address awareness or experience"
    - "incidental use of consciousness without a substantive claim or definition"
    - "claims that Science, Advaita, and Samkhya offer the same account"
    - "passages whose primary topic is personal identity rather than awareness"

  common_confusions:
    - "equating consciousness with attention"
    - "equating consciousness with intelligence"
    - "equating consciousness with verbal report"
    - "equating Advaita witness consciousness with a scientific observer model"
    - "equating Samkhya Purusha with the Advaita Atman or Brahman"
    - "treating buddhi or mind as conscious in exactly the same sense as Purusha"
    - "treating neural correlation as a complete metaphysical explanation"
    - "using awareness, self, and consciousness as interchangeable labels"

  anchor_text: >-
    Retrieve passages centrally concerned with consciousness as subjective
    experience, awareness, witnessing, or the presence and structure of
    experience. Relevant scientific passages may discuss phenomenal
    consciousness, conscious perception, neural or cognitive correlates,
    levels and contents of consciousness, bodily self-consciousness, or the
    distinction between conscious and unconscious processing. Scientific
    relevance does not require commitment to a particular metaphysical theory.

    Relevant Advaita Vedanta passages may discuss cit or chaitanya,
    self-luminous awareness, the sakshin or witness, Atman as consciousness,
    Brahman as consciousness, or awareness as distinct from body, senses,
    mind, ego, and mental modifications. They may also address awareness
    across waking, dream, and deep sleep. These claims must remain identified
    as Advaita claims and must not be rewritten as scientific findings.

    Relevant Samkhya passages may discuss Purusha as the seer, witness,
    sentient principle, or non-agent consciousness; the distinction between
    conscious Purusha and unconscious Prakriti; or the way buddhi appears
    conscious through its relation to Purusha. Samkhya terminology must not be
    collapsed into Advaita terminology.

    Exclude passages about attention, cognition, intelligence, wakefulness,
    mind, soul, or knowledge when they do not substantively address subjective
    experience or awareness. Prefer passages in which consciousness is a
    central explanatory, experiential, or metaphysical subject rather than an
    incidental word.

  anchor_version: "phase1-anchor-v1"
  reviewed_by: "Abhinav"
  reviewed_at: "2026-08-03T23:23:26+05:30"


- concept_id: "10000000-0000-4000-8000-000000000001"
  concept_slug: "self_identity"

  canonical_definition: >-
    Self and identity concern what constitutes a subject or person, how the
    sense of being a self is formed, and what persists or is mistaken for the
    self. The concept includes bodily, experiential, psychological, narrative,
    and metaphysical accounts of selfhood. It also includes distinctions
    between ego, individual identity, witnessing subject, and ultimate or
    irreducible self, interpreted according to each domain's own framework.

  positive_indicators:
    - "personal identity or persistence of the person"
    - "minimal, embodied, narrative, or autobiographical self"
    - "self-models and the construction of self-representation"
    - "body ownership, agency, self-location, or first-person perspective"
    - "ego, I-making, or identification with body and mind"
    - "Atman, jiva, ahamkara, or the witness as accounts of selfhood"
    - "Purusha, ahamkara, buddhi, and mistaken identification"
    - "the distinction between true self and apparent or empirical identity"
    - "the relation between selfhood, memory, embodiment, and experience"
    - "loss, alteration, illusion, or dissolution of the sense of self"

  domain_terminology:
    science:
      - "minimal self"
      - "bodily self"
      - "narrative self"
      - "autobiographical self"
      - "self-model"
      - "self-representation"
