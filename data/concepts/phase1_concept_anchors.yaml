      - "experience attributed to the conjunction of Purusha and Prakriti"
      - "discriminative knowledge"
      - "isolation of Purusha"

  related_non_equivalent_terms:
    - "consciousness"
    - "personality"
    - "ego"
    - "memory"
    - "body"
    - "agency"
    - "ownership"
    - "subjectivity"
    - "individuality"
    - "Atman"
    - "jiva"
    - "Purusha"
    - "ahamkara"
    - "buddhi"
    - "soul"

  explicit_exclusions:
    - "identity used only for names, identifiers, demographics, or database records"
    - "group, cultural, national, or organizational identity without selfhood"
    - "personality traits discussed without a claim about the self"
    - "body perception with no connection to ownership, agency, or self-location"
    - "memory discussed without relevance to persistence or personal identity"
    - "agency discussed only as causal control rather than the sense of self"
    - "Atman or Purusha mentioned without any substantive account of selfhood"
    - "incidental first-person language such as I, me, or mine"
    - "claims that Atman and Purusha are doctrinally identical"
    - "passages primarily about consciousness with no account of self or identity"

  common_confusions:
    - "equating the empirical ego with the Advaita Atman"
    - "equating the Samkhya ahamkara with Purusha"
    - "equating the scientific self-model with a metaphysical Self"
    - "assuming that body ownership proves a permanent personal identity"
    - "treating self, consciousness, person, ego, and soul as synonyms"
    - "equating Advaita's nondual Self with Samkhya's plurality of purushas"
    - "confusing loss of a self-representation with absence of consciousness"
    - "treating narrative identity as the only form of selfhood"

  anchor_text: >-
    Retrieve passages centrally concerned with the self, subject, ego, or
    personal identity. Relevant scientific passages may discuss the minimal
    self, bodily self, self-models, narrative or autobiographical identity,
    self-referential processing, body ownership, agency, self-location,
    first-person perspective, or the continuity and alteration of personal
    identity. Scientific passages may treat selfhood as constructed,
    represented, embodied, distributed, or dependent on cognitive processes.

    Relevant Advaita Vedanta passages may distinguish Atman from body, senses,
    mind, intellect, ego, and empirical individuality; discuss ahamkara or the
    jiva; use neti neti or discrimination to deny mistaken identifications; or
    assert the identity of Atman and Brahman. The empirical individual and the
    ultimate Self must remain distinguished where the source distinguishes
    them.

    Relevant Samkhya passages may distinguish Purusha from Prakriti and its
    evolutes, discuss ahamkara as the I-maker, explain how buddhi and the subtle
    body support individuality, affirm a plurality of purushas, or describe
    bondage as misidentification of the seer with the seen. Samkhya Purusha
    must not be represented as identical to the Advaita Atman or Brahman.

    Exclude administrative identity, group identity, personality description,
    incidental first-person pronouns, and discussions of consciousness that
    do not address selfhood. Prefer passages that define, explain, question,
    alter, deny, or distinguish a form of self or identity.

