- concept_id: "10000000-0000-4000-8000-000000000003"
  concept_slug: "reality_appearance"

  canonical_definition: >-
    Reality and appearance concern the relation between what is experienced or
    represented and what is held to exist or be real. The concept includes
    perception, illusion, hallucination, representation, manifestation, and
    distinctions among levels or modes of reality. It also includes accounts
    of error and misapprehension. Each domain's account must remain distinct:
    scientific perceptual construction, Advaita distinctions involving Maya
    and levels of reality, and Samkhya's account of real Prakriti and its
    manifestations are not interchangeable.

  positive_indicators:
    - "the distinction between physical stimulus and experienced percept"
    - "illusion, hallucination, perceptual error, or misperception"
    - "perceptual construction, inference, representation, or world-model"
    - "the relation between appearance and mind-independent reality"
    - "Maya, avidya, adhyasa, mithya, or nama-rupa"
    - "empirical, apparent, and ultimate levels of reality"
    - "rope-snake or other examples of superimposition"
    - "manifest and unmanifest Prakriti"
    - "the evolution of appearances or experienced objects from Prakriti"
    - "misidentification of Purusha with the products of Prakriti"
    - "how cognition presents objects or properties"
    - "whether the experienced world is constructed, dependent, real, or apparent"

  domain_terminology:
    science:
      - "perception"
      - "perceptual representation"
      - "illusion"
      - "hallucination"
      - "predictive processing"
      - "perceptual inference"
      - "world-model"
      - "sensory construction"
      - "stimulus-percept distinction"
      - "multisensory integration"
      - "phenomenal appearance"
      - "perceptual constancy"
      - "body illusion"
      - "experienced reality"

    advaita:
      - "Maya"
      - "avidya"
      - "adhyasa"
      - "superimposition"
      - "mithya"
      - "nama-rupa"
      - "appearance"
      - "vyavaharika reality"
      - "paramarthika reality"
      - "pratibhasika reality"
      - "rope-snake analogy"
      - "Brahman as reality"
      - "the world as dependent appearance"
      - "sublation"

    samkhya:
      - "Prakriti"
      - "avyakta"
      - "unmanifest"
      - "vyakta"
      - "manifest"
      - "gunas"
      - "evolutes of Prakriti"
      - "mahat"
      - "buddhi"
      - "ahamkara"
      - "tanmatras"
      - "indriyas"
      - "satkaryavada"
      - "transformation"
      - "seer and seen"
      - "misidentification of Purusha and Prakriti"

  related_non_equivalent_terms:
    - "perception"
    - "representation"
    - "experience"
    - "illusion"
    - "hallucination"
    - "error"
    - "Maya"
    - "avidya"
    - "mithya"
    - "Prakriti"
    - "manifestation"
    - "world"
    - "existence"
    - "truth"
    - "consciousness"

  explicit_exclusions:
    - "appearance used only to describe visual style or physical attractiveness"
    - "reality used rhetorically without a claim about existence or perception"
    - "scientific measurement error unrelated to perceptual experience"
    - "fiction, simulation, or virtual reality discussed only as technology"
    - "Maya used as a name, title, or cultural reference"
    - "Prakriti mentioned without manifestation, cognition, or the seen world"
    - "claims that Samkhya regards the world as unreal in the Advaita sense"
    - "claims that perceptual construction proves metaphysical idealism or nonduality"
    - "incidental references to illusion without explanatory relevance"
    - "passages solely about consciousness or selfhood without appearance-reality relations"

  common_confusions:
    - "equating perceptual construction with metaphysical unreality"
    - "equating scientific illusion research with Advaita Maya"
    - "equating Advaita Maya with simple sensory error"
    - "treating mithya as identical to absolute nonexistence"
    - "treating Samkhya Prakriti and its evolutes as unreal"
    - "equating misidentification of Purusha with Advaita superimposition"
    - "assuming that all three domains distinguish reality and appearance in the same way"
    - "confusing a representation with a deliberate fabrication"
    - "using hallucination, illusion, and misperception as interchangeable technical terms"

  anchor_text: >-
    Retrieve passages centrally concerned with the relation between reality
    and appearance, including how experience, perception, cognition, or
    metaphysical conditions present a world that may differ from what is
    ultimately or independently real.

    Relevant scientific passages may discuss perception as construction or
    inference, sensory and multisensory integration, perceptual representation,
    predictive processing, illusions, hallucinations, body illusions,
    phenomenal appearance, or differences between physical stimuli and
    conscious percepts. Such passages do not by themselves establish that the
    external world is unreal or that a metaphysical doctrine is scientifically
    confirmed.

    Relevant Advaita Vedanta passages may discuss Maya, avidya, adhyasa,
    superimposition, nama-rupa, mithya, the distinction among pratibhasika,
    vyavaharika, and paramarthika reality, the rope-snake illustration, or the
    dependence and sublation of appearances in relation to Brahman. Mithya must
    not automatically be translated as absolute nonexistence.

    Relevant Samkhya passages may discuss Prakriti as the real but unconscious
    source of manifestation, the unmanifest and manifest, the gunas, the
    evolutes from mahat and ahamkara through the senses and elements,
    satkaryavada, cognition through buddhi and the senses, or mistaken
    identification of Purusha with the seen. Samkhya must not be described as
    holding that the world is unreal in the Advaita sense.

    Exclude superficial uses of reality, appearance, illusion, Maya, or
    Prakriti. Prefer passages that explain perception, manifestation,
    misapprehension, ontological dependence, levels of reality, or the
    distinction between the seer and what appears.

