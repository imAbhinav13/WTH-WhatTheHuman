      - "empirical self"
      - "apparent individuality"
      - "true Self"

    samkhya:
      - "Purusha"
      - "plurality of purushas"
      - "ahamkara"
      - "I-maker"
      - "buddhi"
      - "individuality"
      - "subtle body"
      - "misidentification of Purusha with Prakriti"
