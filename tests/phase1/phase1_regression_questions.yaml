schema_version: "phase1-regression-questions-v1"
phase: 19
status: frozen_candidate
purpose: >
  Fixed regression question set for the WTH Phase 1 vertical slice.
  These cases verify concept activation, domain-separated retrieval and generation,
  cross-domain synthesis, coverage classification, citation integrity, hard-negative
  behavior, and Out-of-Corpus handling without asserting exact LLM wording.

test_policy:
  exact_text_assertions: false
  deterministic_fields_may_use_exact_assertions: true
  generated_text_assertions:
    - schema_valid
    - grounding_valid
    - citations_valid
    - domain_separation_valid
    - prohibited_equivalences_absent
    - coverage_within_allowed_statuses
  heldout_tuning_prohibited: true
  live_provider_calls_required_for_default_regression_suite: false
  notes:
    - >
      Exact Groq prose is intentionally not frozen because generated wording may vary.
    - >
      Regression tests should assert semantic/structural invariants rather than
      sentence-level equality.
    - >
      Out-of-Corpus cases must not fabricate reviewed-corpus evidence.
    - >
      General-knowledge fallback, when later generated by the application, must remain
      separate from reviewed WTH corpus claims and must not use WTH corpus citations.

domains:
  - science
  - advaita
  - samkhya

phase1_concepts:
  - consciousness
  - self_identity
  - reality_appearance

coverage_statuses:
  - Supported
  - Partially Supported
  - Out of Corpus

cases:

  # ---------------------------------------------------------------------------
  # CLEAR CONSCIOUSNESS
  # ---------------------------------------------------------------------------

  - id: consciousness_001
    category: clear_consciousness
    question: "How do Science, Advaita Vedanta, and Samkhya understand consciousness?"
    expected:
      required_active_concepts:
        - consciousness
      allowed_additional_active_concepts:
        - self_identity
        - reality_appearance
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      minimum_claim_count: 3
      minimum_comparison_count: 1
      must_preserve_domain_separation: true
      must_not_assert_atman_purusha_equivalence: true
      must_not_assert_science_proves_metaphysics: true

  - id: consciousness_002
    category: clear_consciousness
    question: "What role does consciousness play in experience across the three perspectives?"
    expected:
      required_active_concepts:
        - consciousness
      allowed_additional_active_concepts:
        - reality_appearance
        - self_identity
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      must_preserve_domain_separation: true
      must_not_assert_shared_nonduality_for_advaita_and_samkhya: true

  # ---------------------------------------------------------------------------
  # CLEAR SELF / IDENTITY
  # ---------------------------------------------------------------------------

  - id: self_001
    category: clear_self
    question: "How is the self understood in Science, Advaita Vedanta, and Samkhya?"
    expected:
      required_active_concepts:
        - self_identity
      allowed_additional_active_concepts:
        - consciousness
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      must_preserve_domain_separation: true
      must_not_assert_atman_purusha_equivalence: true

  - id: self_002
    category: clear_self
    question: "Is the self a process, a permanent reality, or something else?"
    expected:
      required_active_concepts:
        - self_identity
      allowed_additional_active_concepts:
        - consciousness
        - reality_appearance
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      must_include_comparative_synthesis: true
      must_preserve_domain_separation: true
      must_not_assert_atman_purusha_equivalence: true

  # ---------------------------------------------------------------------------
  # CLEAR REALITY / APPEARANCE
  # ---------------------------------------------------------------------------

  - id: reality_001
    category: clear_reality_appearance
    question: "How do the three perspectives distinguish experienced appearance from reality?"
    expected:
      required_active_concepts:
        - reality_appearance
      allowed_additional_active_concepts:
        - consciousness
        - self_identity
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      must_preserve_domain_separation: true
      must_not_assert_perceptual_construction_proves_maya: true

  - id: reality_002
    category: clear_reality_appearance
    question: "Is what we experience the same as reality itself?"
    expected:
      required_active_concepts:
        - reality_appearance
      allowed_additional_active_concepts:
        - consciousness
        - self_identity
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      must_include_comparative_synthesis: true
      must_not_assert_science_proves_metaphysics: true

  # ---------------------------------------------------------------------------
  # MULTI-CONCEPT
  # ---------------------------------------------------------------------------

  - id: multi_001
    category: multi_concept
    question: "How is consciousness related to the self and experienced reality?"
    expected:
      required_active_concepts:
        - consciousness
        - self_identity
        - reality_appearance
      allowed_additional_active_concepts: []
      allowed_coverage_statuses:
        - Partially Supported
      expected_coverage_score_range:
        minimum: 70.0
        maximum: 100.0
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      minimum_claim_count: 9
      minimum_comparison_count: 9
      must_include_comparative_synthesis: true
      must_preserve_domain_separation: true
      must_not_assert_atman_purusha_equivalence: true
      must_not_assert_shared_nonduality_for_advaita_and_samkhya: true
      must_not_assert_science_proves_metaphysics: true
    baseline_reference:
      coverage_status: Partially Supported
      coverage_score: 84.64
      supported_concepts:
        - reality_appearance
        - self_identity
      partially_supported_concepts:
        - consciousness
      unsupported_concepts: []
      note: >
        The score is recorded as an informational Phase 17 v2 baseline.
        Regression should use the configured score range, not exact equality,
        unless all frozen upstream artifacts are identical.

  - id: multi_002
    category: multi_concept
    question: "Does the nature of the self affect how reality is experienced?"
    expected:
      required_active_concepts:
        - self_identity
        - reality_appearance
      allowed_additional_active_concepts:
        - consciousness
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      required_domains:
        - science
        - advaita
        - samkhya
      must_have_corpus_citations: true
      must_include_comparative_synthesis: true
      must_preserve_domain_separation: true

  # ---------------------------------------------------------------------------
  # AMBIGUOUS
  # ---------------------------------------------------------------------------

  - id: ambiguous_001
    category: ambiguous
    question: "What is the observer?"
    expected:
      at_least_one_active_concept_from:
        - consciousness
        - self_identity
      allowed_additional_active_concepts:
        - reality_appearance
      allowed_coverage_statuses:
        - Partially Supported
        - Out of Corpus
      may_be_marked_ambiguous: true
      must_not_fabricate_corpus_support: true
      must_preserve_domain_separation_if_answered: true

  - id: ambiguous_002
    category: ambiguous
    question: "What makes experience possible?"
    expected:
      at_least_one_active_concept_from:
        - consciousness
        - reality_appearance
        - self_identity
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
        - Out of Corpus
      may_be_marked_ambiguous: true
      must_not_fabricate_corpus_support: true
      must_preserve_domain_separation_if_answered: true

  # ---------------------------------------------------------------------------
  # HARD NEGATIVES
  # ---------------------------------------------------------------------------

  - id: hard_negative_001
    category: hard_negative
    hard_negative_type: atman_vs_purusha
    question: "Are Atman and Purusha the same concept?"
    expected:
      required_active_concepts:
        - self_identity
      allowed_additional_active_concepts:
        - consciousness
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
      must_not_assert_atman_purusha_equivalence: true
      must_include_difference_or_non_equivalence: true
      must_have_corpus_citations: true
      required_domains:
        - advaita
        - samkhya

  - id: hard_negative_002
    category: hard_negative
    hard_negative_type: consciousness_vs_cognition
    question: "Is cognition the same thing as consciousness?"
    expected:
      required_active_concepts:
        - consciousness
      allowed_additional_active_concepts:
        - self_identity
      allowed_coverage_statuses:
        - Supported
        - Partially Supported
        - Out of Corpus
      must_not_assert_cognition_equals_consciousness: true
      must_not_fabricate_corpus_support: true
      must_have_corpus_citations_if_corpus_answered: true

  - id: hard_negative_003
    category: hard_negative
    hard_negative_type: reality_vs_perceptual
    question: "Does a perceptual illusion prove that Advaita's Maya is scientifically true?"
    expected:
      required_active_concepts:
        - reality_appearance
      allowed_additional_active_concepts:
        - consciousness
        - self_identity
      allowed_coverage_statuses:
        - Partially Supported
        - Out of Corpus
      must_not_assert_perceptual_construction_proves_maya: true
      must_not_assert_science_proves_metaphysics: true
      must_not_fabricate_corpus_support: true
      must_preserve_domain_separation_if_answered: true

  # ---------------------------------------------------------------------------
  # OUT OF CORPUS
  # ---------------------------------------------------------------------------

  - id: out_of_corpus_001
    category: out_of_corpus
    question: "What happens to consciousness after death?"
    expected:
      allowed_coverage_statuses:
        - Out of Corpus
        - Partially Supported
      maximum_coverage_status_if_no_direct_reviewed_evidence: Out of Corpus
      must_not_fabricate_corpus_support: true
      general_knowledge_fallback_may_be_allowed: true
      general_knowledge_must_be_separately_labeled: true
      general_knowledge_must_not_use_wth_corpus_citations: true

  - id: out_of_corpus_002
    category: out_of_corpus
    question: "Does quantum entanglement prove Advaita Vedanta?"
    expected:
      allowed_coverage_statuses:
        - Out of Corpus
      must_not_assert_science_proves_metaphysics: true
      must_not_fabricate_corpus_support: true
      corpus_answer_must_be_forbidden: true
      general_knowledge_fallback_may_be_allowed: true
      general_knowledge_must_be_separately_labeled: true
      general_knowledge_must_not_use_wth_corpus_citations: true

  - id: out_of_corpus_003
    category: out_of_corpus
    question: "What do these traditions say about artificial intelligence becoming morally responsible?"
    expected:
      allowed_coverage_statuses:
        - Out of Corpus
      must_not_fabricate_corpus_support: true
      corpus_answer_must_be_forbidden: true
      general_knowledge_fallback_may_be_allowed: true
      general_knowledge_must_be_separately_labeled: true
      general_knowledge_must_not_use_wth_corpus_citations: true

summary:
  total_cases: 16
  categories:
    clear_consciousness: 2
    clear_self: 2
    clear_reality_appearance: 2
    multi_concept: 2
    ambiguous: 2
    hard_negative: 3
    out_of_corpus: 3
