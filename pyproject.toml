[project]
name = "wth-what-the-human"
version = "0.1.0"
description = "Concept-aware comparative retrieval and generation across Science, Advaita Vedanta, and Samkhya."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.139.2",
    "groq==1.5.0",
    "google-genai>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "orjson>=3.10,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings==2.14.2",
    "python-dotenv>=1.0,<2.0",
    "sse-starlette>=2.2,<4.0",
    "structlog>=25.0,<26.0",
    "supabase>=2.0,<3.0",
    "tenacity>=9.0,<10.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=5.7.0",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "respx>=0.22,<1.0",
    "ruff>=0.9,<1.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api", "packages"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "DTZ",
    "G",
    "LOG",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "T20",
    "TRY",
]
ignore = [
    "TRY003",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api", "packages"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests", "packages"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=apps/api",
    "--cov=packages",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = ["live: provider-backed Phase 19 end-to-end tests",]

[tool.coverage.run]
branch = true
source = ["apps/api", "packages"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
skip_covered = true
show_missing = true
