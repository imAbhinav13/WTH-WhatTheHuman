global_exclusion_rules:

  - rule_id: global_front_matter
    category: front_matter
    match_fields:
      - section_title
      - parent_section
      - sample_text
    patterns:
      - "^title page$"
      - "^copyright$"
      - "^contents$"
      - "table of contents"
      - "^dedication$"
      - "^acknowledg(e)?ments?$"
      - "^publisher"
    rationale: "Non-substantive publication material."

  - rule_id: global_indexes
    category: index
    match_fields:
      - section_title
      - parent_section
      - sample_text
    patterns:
      - "^index$"
      - "subject index"
      - "author index"
      - "^concordance$"
    rationale: "Index entries are not suitable claim evidence."

  - rule_id: global_references
    category: references
    match_fields:
      - section_title
      - parent_section
    patterns:
      - "^references?$"
      - "^bibliograph(y|ies)$"
      - "works cited"
      - "literature cited"
    rationale: "Bibliographic lists are not substantive corpus passages."

  - rule_id: global_scanner_noise
    category: scanner_noise
    match_fields:
      - chunk_text
      - sample_text
    patterns:
      - "digitized by"
      - "internet archive"
      - "google book search"
      - "scanned by"
      - "public domain mark"
    rationale: "Scanner and repository metadata."

  - rule_id: global_low_text_quality
    category: text_quality
    conditions:
      maximum_alphabetic_ratio: 0.20
      maximum_ocr_noise_score: 0.20
    rationale: >-
      Exclude severely corrupted text from automatic selection.
      Preserve it in the candidate corpus for possible source-specific
      recovery or future replacement.

hard_negative_categories:

  - category: consciousness_vs_attention
    target_concept: consciousness
    description: >-
      Passages discussing attention, selection, or cognitive access
      without making a substantive claim about subjective awareness.
    positive_terms:
      - attention
      - attentional
      - selection
      - cognitive access
    exclusion_terms:
      - awareness
      - subjective experience
      - phenomenal
      - conscious experience

  - category: consciousness_vs_cognition
    target_concept: consciousness
    description: >-
      Passages discussing thought, reasoning, intellect, memory, or
      cognition without making a claim about conscious experience.
    positive_terms:
      - cognition
      - cognitive
      - thought
      - reasoning
      - memory
      - intellect
      - buddhi
    exclusion_terms:
      - awareness
      - witness
      - sentience
      - subjective experience

  - category: self_vs_ego
    target_concept: self_identity
    description: >-
      Passages discussing ego or ahamkara as a psychological or
      functional construct without identifying it as the ultimate Self
      or conscious subject.
    positive_terms:
      - ego
      - egoity
      - ahamkara
      - ahaṃkāra
    exclusion_terms:
      - atman
      - ātman
      - purusha
      - puruṣa
      - witness
      - true self

  - category: self_vs_personality
    target_concept: self_identity
    description: >-
      Passages discussing personality, temperament, traits, social role,
      or individuality without addressing philosophical selfhood.
    positive_terms:
      - personality
      - temperament
      - traits
      - character
      - individual differences
    exclusion_terms:
      - selfhood
      - personal identity
      - first-person
      - atman
      - purusha

  - category: reality_appearance_vs_cosmology
    target_concept: reality_appearance
    description: >-
      Passages enumerating cosmic evolution, tattvas, elements, or
      creation stages without discussing appearance, illusion,
      perception, or the seer-seen relation.
    positive_terms:
      - evolution
      - elements
      - tattvas
      - creation
      - mahat
      - tanmatra
      - tanmātra
      - five elements
      - subtle elements
    exclusion_terms:
      - appearance
      - illusion
      - maya
      - adhyasa
      - perception
      - seer and seen

  - category: reality_appearance_vs_perceptual_description
    target_concept: reality_appearance
    description: >-
      Passages describing sensory or perceptual mechanisms without
      making an ontological or representational claim.
    positive_terms:
      - visual
      - auditory
      - sensory
      - stimulus
      - perception
      - perceptual
    exclusion_terms:
      - representation
      - illusion
      - hallucination
      - constructed
      - reality
      - appearance

  - category: advaita_atman_vs_samkhya_purusha
    target_concept: self_identity
    description: >-
      Passages useful for testing whether the system preserves the
      distinction between nondual Atman and plural Samkhya Purushas.
    positive_terms:
      - atman
      - ātman
      - purusha
      - puruṣa
      - self
      - witness
    required_domain_contrast:
      - advaita
      - samkhya

