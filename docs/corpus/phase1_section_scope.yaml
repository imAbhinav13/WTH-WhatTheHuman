concept_scope:

  consciousness:
    description: >-
      Passages making substantive claims about awareness, subjective
      experience, conscious presence, witnessing, sentience, or the
      distinction between conscious and non-conscious processes.

    positive_terms:
      - consciousness
      - conscious
      - awareness
      - aware
      - subjective experience
      - phenomenal experience
      - experience
      - witness
      - witnessing
      - witnessing consciousness
      - conscious principle
      - self-luminous
