name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROVIDER_MODE: mock
      APP_ENV: test
      DEBUG: "false"
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: |
          uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run Ruff linting
        run: |
          uv run ruff check .

      - name: Check Ruff formatting
        run: |
          uv run ruff format --check .

      - name: Run mypy
        run: |
          uv run mypy apps packages

      - name: Run tests
        run: |
          uv run pytest

      - name: Verify FastAPI mock startup and health routes
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient

          from apps.api.main import app


          with TestClient(app) as client:
              health_response = client.get("/api/v1/health")
              assert health_response.status_code == 200, (
                  health_response.text
              )
              assert health_response.json()["status"] == "healthy"

              readiness_response = client.get("/api/v1/ready")
              assert readiness_response.status_code == 200, (
                  readiness_response.text
              )

              readiness_body = readiness_response.json()
              assert readiness_body["status"] == "healthy", readiness_body
              assert len(readiness_body["checks"]) == 3

              expected_providers = {
                  "database",
                  "embedding",
                  "generation",
              }
              actual_providers = {
                  check["provider"]
                  for check in readiness_body["checks"]
              }

              assert actual_providers == expected_providers
              assert all(
                  check["status"] == "ready"
                  for check in readiness_body["checks"]
              )

          print(
              "FastAPI mock startup and readiness checks passed."
          )
          PY