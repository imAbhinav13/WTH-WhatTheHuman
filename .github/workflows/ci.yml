name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROVIDER_MODE: mock
      APP_ENV: test
      DEBUG: "false"
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: |
          python -m pip install --editable ".[dev]"

      - name: Run Ruff linting
        run: |
          ruff check .

      - name: Check Ruff formatting
        run: |
          ruff format --check .

      - name: Run mypy
        run: |
          mypy apps

      - name: Run tests
        shell: bash
        run: |
          if find tests -type f -name "test_*.py" -print -quit 2>/dev/null \
            | grep -q .; then
            pytest
          else
            echo "No test files found; skipping pytest during Phase 0."
          fi

      - name: Verify FastAPI mock startup and health routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from apps.api.main import app


          with TestClient(app) as client:
              health_response = client.get("/api/v1/health")
              assert health_response.status_code == 200, (
                  health_response.text
              )

              health_body = health_response.json()
              assert health_body["status"] == "healthy", health_body

              readiness_response = client.get("/api/v1/ready")
              assert readiness_response.status_code == 200, (
                  readiness_response.text
              )

              readiness_body = readiness_response.json()
              assert readiness_body["status"] == "healthy", readiness_body

              checks = readiness_body["checks"]
              assert len(checks) == 3, checks

              expected_providers = {
                  "database",
                  "embedding",
                  "generation",
              }
              actual_providers = {
                  check["provider"]
                  for check in checks
              }

              assert actual_providers == expected_providers, checks
              assert all(
                  check["status"] == "ready"
                  for check in checks
              ), checks

          print("FastAPI mock startup and readiness checks passed.")
          PY